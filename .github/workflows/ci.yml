name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The persistence suites guard themselves with `DATABASE_HOST ? describe :
    # describe.skip`. Without a database here they skipped silently and the
    # check stayed green: atomicity, the outbox and deduplication were never
    # verified in CI. The database below and the skip guard after the e2e run
    # close that together.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: fiapx
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d fiapx"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_HOST: localhost
      DATABASE_PORT: 5432
      # No DATABASE_NAME: the e2e harness defaults it to fiapx_e2e and refuses
      # fiapx. Its global setup creates that database as the service's admin
      # user (postgres/postgres, the harness's DATABASE_ADMIN_* defaults).
      DATABASE_SCHEMA: catalog
      DATABASE_USER: catalog
      DATABASE_PASSWORD: catalog
    steps:
      - uses: actions/checkout@v4
      # The schema and role come from the platform's bootstrap, the same file
      # the local topology runs, so CI cannot drift from what the stack uses.
      # The repository is public, so no token is needed.
      - uses: actions/checkout@v4
        with:
          repository: tech-challenge-workshop/fiap-x-platform
          path: .platform
          sparse-checkout: db/init
      - name: Bootstrap the database
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d fiapx -v ON_ERROR_STOP=1 -f .platform/db/init/01-schemas.sql
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --coverage
      - run: npm run test:e2e -- --json --outputFile=e2e-results.json
      - name: Fail if any e2e test was skipped
        run: |
          node -e '
            const r = require("./e2e-results.json");
            const skipped = r.numPendingTests + r.numTodoTests;
            console.log(r.numPassedTests + " passed, " + skipped + " skipped");
            if (skipped > 0) {
              console.error("e2e tests were skipped - a green run would not mean they passed");
              process.exit(1);
            }
          '
      - run: npm run build
      - name: Upload coverage summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore

  # Builds linux/amd64 and linux/arm64 on every run; pushes to GHCR only on
  # a push to main, as :<sha> and :main (the tag the local kind cluster pulls,
  # fiap-x-platform AD-018). Pull requests build without pushing. The job
  # authenticates with the workflow's GITHUB_TOKEN, never a personal token.
  image:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build the container image (push on main)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/tech-challenge-workshop/processing-catalog:${{ github.sha }}
            ghcr.io/tech-challenge-workshop/processing-catalog:main
          labels: |
            org.opencontainers.image.source=https://github.com/tech-challenge-workshop/processing-catalog
